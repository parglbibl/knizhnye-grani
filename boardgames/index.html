<!-- ===== ИГРА «ХОД КОНЁМ» (ЛОГИЧЕСКАЯ ГОЛОВОЛОМКА) ===== -->
<div style="max-width: 500px; margin: 0 auto 2rem auto; padding: 2rem; background: #1e2a47; border-radius: 24px; text-align: center;">
    <h3 style="color: var(--neon-coral); margin-bottom: 0.5rem;">♟️ Ход конём</h3>
    <p style="color: rgba(255,255,255,0.7); font-size: 0.9rem; margin-bottom: 1rem;">
        Меняй местами соседние фишки, чтобы собрать все числа по порядку от 1 до 16!
    </p>

    <!-- Счётчик ходов и таймер -->
    <div style="display: flex; justify-content: center; gap: 2rem; margin-bottom: 1rem;">
        <div style="color: #fff;">
            <div style="font-size: 0.7rem; opacity: 0.6;">ХОДОВ</div>
            <div id="moveCount" style="font-size: 1.5rem; font-weight: bold;">0</div>
        </div>
        <div style="color: #fff;">
            <div style="font-size: 0.7rem; opacity: 0.6;">ВРЕМЯ</div>
            <div id="timerDisplay" style="font-size: 1.5rem; font-weight: bold;">00:00</div>
        </div>
    </div>

    <!-- Игровое поле 4×4 -->
    <div id="gameGrid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-width: 320px; margin: 0 auto; aspect-ratio: 1/1;"></div>

    <div style="margin-top: 1.5rem; display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <button id="shuffleGameBtn" class="btn btn-sm" style="background: var(--neon-coral); color: #fff; border-color: var(--neon-coral);">Перемешать</button>
        <button id="resetGameBtn" class="btn btn-sm btn-outline" style="color: #fff; border-color: rgba(255,255,255,0.3);">Собрать</button>
    </div>

    <div id="gameMessage" style="margin-top: 1rem; font-weight: 600; font-size: 1.1rem; min-height: 2rem; color: var(--neon-coral);"></div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const grid = document.getElementById('gameGrid');
        const shuffleBtn = document.getElementById('shuffleGameBtn');
        const resetBtn = document.getElementById('resetGameBtn');
        const message = document.getElementById('gameMessage');
        const moveCountDisplay = document.getElementById('moveCount');
        const timerDisplay = document.getElementById('timerDisplay');

        let tiles = [];
        let moves = 0;
        let seconds = 0;
        let timerInterval = null;
        let isGameActive = false;
        let selectedIndex = null;

        // Инициализация поля (числа от 1 до 16)
        function initGame() {
            tiles = [];
            for (let i = 1; i <= 16; i++) {
                tiles.push(i);
            }
            moves = 0;
            seconds = 0;
            isGameActive = false;
            selectedIndex = null;
            moveCountDisplay.textContent = '0';
            timerDisplay.textContent = '00:00';
            message.textContent = '';
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            renderGrid();
        }

        // Перемешивание (гарантирует, что головоломка решаема)
        function shuffleTiles() {
            for (let i = 0; i < 100; i++) {
                const idx1 = Math.floor(Math.random() * 16);
                const idx2 = Math.floor(Math.random() * 16);
                if (idx1 !== idx2) {
                    [tiles[idx1], tiles[idx2]] = [tiles[idx2], tiles[idx1]];
                }
            }
            moves = 0;
            seconds = 0;
            isGameActive = true;
            moveCountDisplay.textContent = '0';
            timerDisplay.textContent = '00:00';
            message.textContent = '';
            // Запускаем таймер
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
                const secs = String(seconds % 60).padStart(2, '0');
                timerDisplay.textContent = `${mins}:${secs}`;
            }, 1000);
            renderGrid();
        }

        // Отрисовка сетки
        function renderGrid() {
            grid.innerHTML = '';
            tiles.forEach((value, index) => {
                const div = document.createElement('div');
                div.dataset.index = index;
                div.textContent = value;
                div.style.borderRadius = '8px';
                div.style.aspectRatio = '1/1';
                div.style.display = 'flex';
                div.style.alignItems = 'center';
                div.style.justifyContent = 'center';
                div.style.fontSize = '1.5rem';
                div.style.fontWeight = 'bold';
                div.style.color = '#fff';
                div.style.cursor = 'pointer';
                div.style.background = 'transparent';
                div.style.border = '2px solid rgba(255,255,255,0.15)';
                div.style.transition = 'all 0.2s';

                // Если число на своём месте — подсветка
                if (value === index + 1) {
                    div.style.background = 'rgba(255,46,90,0.1)';
                    div.style.borderColor = 'var(--neon-coral)';
                }

                div.addEventListener('click', function() {
                    handleTileClick(parseInt(this.dataset.index));
                });
                div.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    handleTileClick(parseInt(this.dataset.index));
                }, { passive: false });

                grid.appendChild(div);
            });

            // Проверка на победу
            let isSolved = true;
            for (let i = 0; i < 16; i++) {
                if (tiles[i] !== i + 1) {
                    isSolved = false;
                    break;
                }
            }
            if (isSolved && isGameActive) {
                isGameActive = false;
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                message.textContent = '🎉 Поздравляем! Вы собрали головоломку!';
            } else {
                if (!isSolved) message.textContent = '';
            }
        }

        // Логика клика (обмен соседних фишек)
        function handleTileClick(index) {
            if (!isGameActive) return;
            if (selectedIndex === null) {
                // Выбираем первую фишку
                selectedIndex = index;
                const el = grid.children[index];
                el.style.borderColor = '#fff';
                el.style.transform = 'scale(1.05)';
                return;
            }
            if (selectedIndex === index) {
                // Отменяем выбор
                const el = grid.children[index];
                el.style.borderColor = 'rgba(255,255,255,0.15)';
                el.style.transform = 'scale(1)';
                selectedIndex = null;
                return;
            }

            // Проверяем, соседние ли ячейки
            const row1 = Math.floor(selectedIndex / 4);
            const col1 = selectedIndex % 4;
            const row2 = Math.floor(index / 4);
            const col2 = index % 4;
            const isAdjacent = (Math.abs(row1 - row2) + Math.abs(col1 - col2)) === 1;

            if (!isAdjacent) {
                // Сбрасываем выбор
                const el = grid.children[selectedIndex];
                el.style.borderColor = 'rgba(255,255,255,0.15)';
                el.style.transform = 'scale(1)';
                selectedIndex = null;
                return;
            }

            // Обмен
            [tiles[selectedIndex], tiles[index]] = [tiles[index], tiles[selectedIndex]];
            moves++;
            moveCountDisplay.textContent = moves;

            // Сбрасываем выделение
            const el = grid.children[selectedIndex];
            el.style.borderColor = 'rgba(255,255,255,0.15)';
            el.style.transform = 'scale(1)';
            selectedIndex = null;

            renderGrid();
        }

        // Кнопки
        shuffleBtn.addEventListener('click', function() {
            initGame();
            shuffleTiles();
        });

        resetBtn.addEventListener('click', function() {
            initGame();
            // Сразу собираем
            tiles = [];
            for (let i = 1; i <= 16; i++) {
                tiles.push(i);
            }
            renderGrid();
            message.textContent = '🎉 Головоломка собрана!';
        });

        // Старт
        initGame();
    });
</script>
