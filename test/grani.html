<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест кубика — ручное вращение</title>
    <style>
        body {
            margin: 0;
            background: #fef9f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        #cube-container {
            width: 80vmin;
            max-width: 500px;
            aspect-ratio: 1/1;
            background: transparent;
            touch-action: none;
            cursor: pointer;
            position: relative;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 10px 24px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }
        #btnScramble {
            background: #ff2e5a;
            color: #fff;
        }
        #btnScramble:hover {
            transform: scale(1.05);
        }
        #btnSolve {
            background: #2ecc71;
            color: #fff;
            display: none;
        }
        #btnSolve:hover {
            transform: scale(1.05);
        }
        .info {
            margin-top: 20px;
            font-size: 14px;
            color: #555;
            text-align: center;
            max-width: 400px;
        }
        .info strong {
            color: #ff2e5a;
        }
    </style>
</head>
<body>

    <div id="cube-container"></div>

    <div class="controls">
        <button id="btnScramble">Перемешать</button>
        <button id="btnSolve">Собрать</button>
    </div>

    <div class="info">
        🔄 <strong>Свайп</strong> — вращай грани (всегда работает).<br>
        👆 <strong>Клик</strong> — открывает вопрос <strong>только на собранном кубике</strong>.
    </div>

    <div id="popup" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); backdrop-filter:blur(6px); z-index:9999; align-items:center; justify-content:center;">
        <div style="background:#fff; max-width:500px; width:90%; padding:2rem; border-radius:28px; position:relative;">
            <button onclick="document.getElementById('popup').style.display='none'" style="position:absolute; top:15px; right:20px; font-size:28px; background:none; border:none; cursor:pointer; color:#999;">×</button>
            <h2 id="popupTitle" style="color:#1e2a3a; margin-bottom:0.5rem;">Грань</h2>
            <p id="popupQuestion" style="font-size:1.05rem; line-height:1.6; color:#333;"></p>
        </div>
    </div>

    <!-- ===== ПОДКЛЮЧАЕМ МОДУЛЬ ===== -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="./js/cube3d.js"></script>
</body>
</html>
