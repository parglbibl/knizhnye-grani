<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кубик Рубика — кнопки R, L, F, B, U, D</title>
    <style>
        body {
            margin: 0;
            background: #fef9f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        #cube-container {
            width: 80vmin;
            max-width: 500px;
            aspect-ratio: 1/1;
            background: transparent;
            touch-action: none;
            cursor: pointer;
            position: relative;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 10px 24px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }
        #btnScramble {
            background: #ff2e5a;
            color: #fff;
        }
        #btnScramble:hover {
            transform: scale(1.05);
        }
        #btnSolve {
            background: #2ecc71;
            color: #fff;
            display: none;
        }
        #btnSolve:hover {
            transform: scale(1.05);
        }
        .info {
            margin-top: 20px;
            font-size: 14px;
            color: #555;
            text-align: center;
            max-width: 400px;
        }
        .info strong {
            color: #ff2e5a;
        }

        /* ===== КНОПКИ ПОВОРОТА ГРАНЕЙ (R, L, F, B, U, D) ===== */
        .cube-buttons {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: center;
        }
        .btn-row {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .cube-btn {
            padding: 0.6rem 1.2rem;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            border: none;
            border-radius: 12px;
            background: #1e2a47;
            color: #fff;
            cursor: pointer;
            transition: all 0.15s ease;
            touch-action: manipulation;
            min-width: 60px;
            min-height: 44px;
            box-shadow: 0 4px 0 #0f1520;
            user-select: none;
            letter-spacing: 0.5px;
        }
        .cube-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #0f1520;
        }
        .cube-btn:hover {
            background: #2a3a5a;
        }
        .cube-btn.prime {
            background: #3a2a4a;
            box-shadow: 0 4px 0 #1f152a;
        }
        .cube-btn.prime:hover {
            background: #4a3a5a;
        }
        /* цветные акценты для граней */
        .cube-btn.r { background: #c41e3a; box-shadow: 0 4px 0 #7a1224; }
        .cube-btn.r:hover { background: #d42a46; }
        .cube-btn.l { background: #f39c12; box-shadow: 0 4px 0 #b36d0b; }
        .cube-btn.l:hover { background: #f7b731; }
        .cube-btn.f { background: #27ae60; box-shadow: 0 4px 0 #1a7a42; }
        .cube-btn.f:hover { background: #2ecc71; }
        .cube-btn.b { background: #2980b9; box-shadow: 0 4px 0 #1a5276; }
        .cube-btn.b:hover { background: #3498db; }
        .cube-btn.u { background: #f1c40f; box-shadow: 0 4px 0 #b7950b; color: #1e2a47; }
        .cube-btn.u:hover { background: #f4d03f; }
        .cube-btn.d { background: #8e44ad; box-shadow: 0 4px 0 #5b2d6e; }
        .cube-btn.d:hover { background: #a569bd; }

        .cube-btn.prime.r { background: #a01830; box-shadow: 0 4px 0 #5e0e1c; }
        .cube-btn.prime.r:hover { background: #b81e3a; }
        .cube-btn.prime.l { background: #d4890b; box-shadow: 0 4px 0 #8a5a07; }
        .cube-btn.prime.l:hover { background: #e6a017; }
        .cube-btn.prime.f { background: #1e8e4a; box-shadow: 0 4px 0 #0f5a2e; }
        .cube-btn.prime.f:hover { background: #26a85a; }
        .cube-btn.prime.b { background: #1f6a93; box-shadow: 0 4px 0 #0f3e5a; }
        .cube-btn.prime.b:hover { background: #287aa8; }
        .cube-btn.prime.u { background: #d4ac0d; box-shadow: 0 4px 0 #8a7007; color: #1e2a47; }
        .cube-btn.prime.u:hover { background: #e6c019; }
        .cube-btn.prime.d { background: #6f3490; box-shadow: 0 4px 0 #451f5a; }
        .cube-btn.prime.d:hover { background: #8844a8; }

        @media (max-width: 600px) {
            .cube-btn {
                padding: 0.4rem 0.8rem;
                font-size: 0.8rem;
                min-width: 50px;
                min-height: 36px;
            }
        }
    </style>
</head>
<body>

    <div id="cube-container"></div>

    <!-- ===== КНОПКИ «ПЕРЕМЕШАТЬ» И «СОБРАТЬ» ===== -->
    <div class="controls">
        <button id="btnScramble">Перемешать</button>
        <button id="btnSolve">Собрать</button>
    </div>

    <!-- ===== КНОПКИ ПОВОРОТА ГРАНЕЙ ===== -->
    <div class="cube-buttons">
        <!-- R / R'  и  L / L' -->
        <div class="btn-row">
            <button class="cube-btn r" onclick="window.doMove('R')">R</button>
            <button class="cube-btn prime r" onclick="window.doMove('R_prime')">R'</button>
            <button class="cube-btn l" onclick="window.doMove('L')">L</button>
            <button class="cube-btn prime l" onclick="window.doMove('L_prime')">L'</button>
        </div>
        <!-- F / F'  и  B / B' -->
        <div class="btn-row">
            <button class="cube-btn f" onclick="window.doMove('F')">F</button>
            <button class="cube-btn prime f" onclick="window.doMove('F_prime')">F'</button>
            <button class="cube-btn b" onclick="window.doMove('B')">B</button>
            <button class="cube-btn prime b" onclick="window.doMove('B_prime')">B'</button>
        </div>
        <!-- U / U'  и  D / D' -->
        <div class="btn-row">
            <button class="cube-btn u" onclick="window.doMove('U')">U</button>
            <button class="cube-btn prime u" onclick="window.doMove('U_prime')">U'</button>
            <button class="cube-btn d" onclick="window.doMove('D')">D</button>
            <button class="cube-btn prime d" onclick="window.doMove('D_prime')">D'</button>
        </div>
    </div>

    <!-- ===== ПОПАП ДЛЯ ВОПРОСОВ ===== -->
    <div id="popup" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); backdrop-filter:blur(6px); z-index:9999; align-items:center; justify-content:center;">
        <div style="background:#fff; max-width:500px; width:90%; padding:2rem; border-radius:28px; position:relative;">
            <button onclick="document.getElementById('popup').style.display='none'" style="position:absolute; top:15px; right:20px; font-size:28px; background:none; border:none; cursor:pointer; color:#999;">×</button>
            <h2 id="popupTitle" style="color:#1e2a3a; margin-bottom:0.5rem;">Грань</h2>
            <p id="popupQuestion" style="font-size:1.05rem; line-height:1.6; color:#333;"></p>
        </div>
    </div>

    <!-- ===== ПОДКЛЮЧАЕМ THREE.JS ЧЕРЕЗ CDN ===== -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <!-- ===== ПОДКЛЮЧАЕМ МОДУЛЬ КУБИКА ===== -->
    <script type="module" src="./js/cube3d.js"></script>
</body>
</html>
