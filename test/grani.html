<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Кубик Рубика</title>
    <style>
        /* Сброс стилей и базовые настройки */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            user-select: none;
        }

        /* Главный контейнер для кубика */
        #cube-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Блок с кнопками внизу экрана */
        #controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            pointer-events: none; /* Чтобы клики проходили сквозь пустое место */
        }

        #controls button {
            pointer-events: auto; /* Включаем клики на самих кнопках */
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }

        #btnScramble {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        #btnScramble:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }

        #btnSolve {
            display: none; /* Скрыта по умолчанию */
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        #btnSolve:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.4);
        }

        /* Попап (если он нужен) */
        #popup {
            display: none; /* Скрыт по умолчанию */
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        #popup-content {
            background: #2a2a4a;
            padding: 40px;
            border-radius: 20px;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        #popup-content h2 {
            margin-top: 0;
            color: #4facfe;
        }

        #popup-content p {
            line-height: 1.6;
            color: #ccc;
        }

        #popup-content button {
            margin-top: 20px;
            padding: 10px 25px;
            background: #4facfe;
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        #popup-content button:hover {
            background: #3b8fd9;
        }
    </style>
</head>
<body>

    <!-- Контейнер для рендера Three.js -->
    <div id="cube-container"></div>

    <!-- Кнопки управления -->
    <div id="controls">
        <button id="btnScramble">🌀 Перемешать</button>
        <button id="btnSolve">✨ Собрать</button>
    </div>

    <!-- Попап (если он у вас есть, иначе просто удалите этот блок) -->
    <div id="popup">
        <div id="popup-content">
            <h2>Кубик Рубика</h2>
            <p>Нажимайте на кнопки "Перемешать" и "Собрать".<br>
            Вы также можете вращать камеру мышкой и крутить грани, нажимая на кубик.</p>
            <button onclick="document.getElementById('popup').style.display='none'">Закрыть</button>
        </div>
    </div>

    <!-- Подключение вашего скрипта. Убедитесь, что путь правильный -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- Если ваш скрипт лежит рядом, называется index.js и использует import -->
    <script type="module" src="./index.js"></script> 

</body>
</html>
