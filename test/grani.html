<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест кубика — кнопочное управление</title>
    <style>
        body {
            margin: 0;
            background: #fef9f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        #cube-container {
            width: 80vmin;
            max-width: 500px;
            aspect-ratio: 1/1;
            background: transparent;
            touch-action: none;
            cursor: pointer;
            position: relative;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 10px 24px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }
        #btnScramble {
            background: #ff2e5a;
            color: #fff;
        }
        #btnScramble:hover {
            transform: scale(1.05);
        }
        #btnSolve {
            background: #2ecc71;
            color: #fff;
            display: none;
        }
        #btnSolve:hover {
            transform: scale(1.05);
        }
        .info {
            margin-top: 20px;
            font-size: 14px;
            color: #555;
            text-align: center;
            max-width: 400px;
        }
        .info strong {
            color: #ff2e5a;
        }

        /* ===== КНОПКИ ПОВОРОТА ГРАНЕЙ ===== */
        .cube-buttons {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: center;
        }
        .btn-row {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .cube-btn {
            padding: 0.6rem 1.2rem;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            border: none;
            border-radius: 12px;
            background: #1e2a47;
            color: #fff;
            cursor: pointer;
            transition: all 0.15s ease;
            touch-action: manipulation;
            min-width: 44px;
            min-height: 44px;
            box-shadow: 0 4px 0 #0f1520;
            user-select: none;
        }
        .cube-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #0f1520;
        }
        .cube-btn:hover {
            background: #2a3a5a;
        }
        .cube-btn.prime {
            background: #3a2a4a;
            box-shadow: 0 4px 0 #1f152a;
        }
        .cube-btn.prime:hover {
            background: #4a3a5a;
        }
        @media (max-width: 600px) {
            .cube-btn {
                padding: 0.4rem 0.8rem;
                font-size: 0.85rem;
                min-width: 36px;
                min-height: 36px;
            }
        }
    </style>
</head>
<body>

    <div id="cube-container"></div>

    <!-- ===== КНОПКИ «ПЕРЕМЕШАТЬ» И «СОБРАТЬ» ===== -->
    <div class="controls">
        <button id="btnScramble">Перемешать</button>
        <button id="btnSolve">Собрать</button>
    </div>

    <!-- ===== КНОПКИ ПОВОРОТА ГРАНЕЙ ===== -->
    <div class="cube-buttons">
        <div class="btn-row">
            <button class="cube-btn" data-move="U">U</button>
            <button class="cube-btn" data-move="D">D</button>
            <button class="cube-btn" data-move="L">L</button>
            <button class="cube-btn" data-move="R">R</button>
            <button class="cube-btn" data-move="F">F</button>
            <button class="cube-btn" data-move="B">B</button>
        </div>
        <div class="btn-row">
            <button class="cube-btn prime" data-move="U'">U'</button>
            <button class="cube-btn prime" data-move="D'">D'</button>
            <button class="cube-btn prime" data-move="L'">L'</button>
            <button class="cube-btn prime" data-move="R'">R'</button>
            <button class="cube-btn prime" data-move="F'">F'</button>
            <button class="cube-btn prime" data-move="B'">B'</button>
        </div>
    </div>

    <!-- ===== ПОПАП ДЛЯ ВОПРОСОВ ===== -->
    <div id="popup" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); backdrop-filter:blur(6px); z-index:9999; align-items:center; justify-content:center;">
        <div style="background:#fff; max-width:500px; width:90%; padding:2rem; border-radius:28px; position:relative;">
            <button onclick="document.getElementById('popup').style.display='none'" style="position:absolute; top:15px; right:20px; font-size:28px; background:none; border:none; cursor:pointer; color:#999;">×</button>
            <h2 id="popupTitle" style="color:#1e2a3a; margin-bottom:0.5rem;">Грань</h2>
            <p id="popupQuestion" style="font-size:1.05rem; line-height:1.6; color:#333;"></p>
        </div>
    </div>

    <!-- ===== ПОДКЛЮЧАЕМ THREE.JS ЧЕРЕЗ CDN ===== -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <!-- ===== ПОДКЛЮЧАЕМ МОДУЛЬ КУБИКА ===== -->
    <script type="module" src="./js/cube3d.js"></script>

    <!-- ===== ОБРАБОТЧИКИ КНОПОК ПОВОРОТА (прямо здесь, надёжно) ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const btns = document.querySelectorAll('.cube-btn');
            btns.forEach(btn => {
                btn.addEventListener('click', function() {
                    // Защита: если кубик собран или идёт анимация — не реагируем
                    if (window.isSolved === true) return;
                    if (window.isScrambling || window.isAnimating || window.isBlocked) return;

                    const moveStr = this.dataset.move;
                    if (!moveStr) return;

                    // Вызываем функцию поворота, которая есть в глобальной области cube3d.js
                    // Мы будем использовать window.doMove(moveStr)
                    if (typeof window.doMove === 'function') {
                        window.doMove(moveStr);
                    } else {
                        console.warn('Функция doMove не найдена. Проверьте cube3d.js');
                    }
                });
            });
        });
    </script>
</body>
</html>
