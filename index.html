<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- (всё то же самое, что и в предыдущем полном файле, до секции <script>) -->
    <!-- ... -->
</head>
<body>
    <!-- (всё тело страницы то же самое) -->
    <!-- ... -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const slider = document.getElementById('archiveSlider');
            const prevBtn = document.querySelector('.archive-arrow.prev');
            const nextBtn = document.querySelector('.archive-arrow.next');
            const countEl = document.getElementById('archiveCount');
            const modal = document.getElementById('archiveModal');
            const closeBtn = document.getElementById('archiveModalClose');
            const modalBody = document.getElementById('archiveModalBody');
            
            const archiveData = {
                '17 июня': {
                    title: 'Игротека «Книжные грани»',
                    date: '17 июня 2026',
                    image: '/images/afisha/afisha1706.jpg',
                    description: 'Первая летняя игротека в Библиотеке-мастерской. Мастер-класс по сборке кубика Рубика и большая игротека от Hobby World.',
                    link: '/events/detail.html?id=summer-party',
                    video: 'https://vk.com/video_ext.php?oid=-235758347&id=456239103&autoplay=0&hd=1'
                },
                '1 июля': {
                    title: 'Игротека «Книжные грани»',
                    date: '1 июля 2026',
                    image: '/images/afisha/afisha0107.PNG',
                    description: 'Большая игротека от Hobby World. Десятки настольных игр на любой вкус. Приходите один или с друзьями — найдём компанию!',
                    link: '/events/detail.html?id=july-party',
                    gallery: '/gallery/july-01.html'  // ← ссылка на новую страницу с фото
                }
            };
            
            window.closeModal = function() {
                if (modal) {
                    modal.classList.remove('active');
                    document.body.style.overflow = '';
                }
            };
            
            window.closeModalAndGo = function(event, url) {
                if (modal) {
                    modal.classList.remove('active');
                    document.body.style.overflow = '';
                }
                if (url) {
                    window.location.href = url;
                }
                if (event) {
                    event.preventDefault();
                }
            };
            
            window.openArchiveModal = function(eventKey) {
                const data = archiveData[eventKey];
                if (!data) return;
                
                let mediaHtml = '';
                if (data.image) {
                    mediaHtml = `<div class="archive-modal-image"><img src="${data.image}" alt="${data.title}"></div>`;
                } else {
                    mediaHtml = `<div class="archive-modal-image" style="background: linear-gradient(135deg, #2a3a5a, #1a2a3a); height: 200px; display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-calendar-alt" style="font-size: 3rem; color: rgba(255,255,255,0.2);"></i>
                    </div>`;
                }
                
                let reportBtn = '';
                if (data.video) {
                    reportBtn = `<a href="${data.video}" class="btn btn-sm" target="_blank" onclick="closeModalAndGo(event, '${data.video}')">📹 Смотреть видеоотчёт</a>`;
                } else if (data.gallery) {
                    reportBtn = `<a href="${data.gallery}" class="btn btn-sm" target="_blank" onclick="closeModalAndGo(event, '${data.gallery}')">📸 Смотреть фотоотчёт</a>`;
                }
                
                if (modalBody) {
                    modalBody.innerHTML = `
                        ${mediaHtml}
                        <div class="archive-modal-date">📅 ${data.date}</div>
                        <h2 class="archive-modal-title">${data.title}</h2>
                        <p class="archive-modal-desc">${data.description}</p>
                        <div class="archive-modal-actions">
                            ${reportBtn}
                            <a href="${data.link}" class="btn btn-sm" onclick="closeModalAndGo(event, '${data.link}')">📝 Подробнее</a>
                        </div>
                    `;
                }
                
                if (modal) {
                    modal.classList.add('active');
                    document.body.style.overflow = 'hidden';
                }
            };
            
            if (closeBtn) {
                closeBtn.addEventListener('click', function() {
                    modal.classList.remove('active');
                    document.body.style.overflow = '';
                });
            }
            
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.classList.remove('active');
                    document.body.style.overflow = '';
                }
            });
            
            if (slider && prevBtn && nextBtn) {
                const cardWidth = 200 + 16;
                const cards = slider.querySelectorAll('.archive-card');
                if (countEl) {
                    const count = cards.length;
                    const word = count === 1 ? 'мероприятие' : (count < 5 ? 'мероприятия' : 'мероприятий');
                    countEl.textContent = count + ' ' + word;
                }
                nextBtn.addEventListener('click', function() { slider.scrollBy({ left: cardWidth * 2, behavior: 'smooth' }); });
                prevBtn.addEventListener('click', function() { slider.scrollBy({ left: -cardWidth * 2, behavior: 'smooth' }); });
            }
            
            document.querySelectorAll('.archive-card').forEach(card => {
                card.addEventListener('click', function() {
                    const eventName = this.dataset.event;
                    if (eventName && archiveData[eventName]) {
                        window.openArchiveModal(eventName);
                    }
                });
            });
        });
    </script>
</body>
</html>
