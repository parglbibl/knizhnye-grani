    <style>
        /* ===== СЛАЙДЕР «КАК ЭТО БЫЛО» ===== */
        .archive-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .archive-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--graphite-dark);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .archive-count {
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: rgba(0,0,0,0.05);
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
        }

        .archive-slider-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .archive-slider {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 0.5rem 0;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .archive-slider::-webkit-scrollbar {
            display: none;
        }

        .archive-card {
            flex: 0 0 200px;
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .archive-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .archive-image {
            height: 120px;
            overflow: hidden;
            background: var(--graphite-dark);
        }

        .archive-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .archive-info {
            padding: 0.8rem 1rem;
        }

        .archive-date {
            font-size: 0.65rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .archive-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--graphite-dark);
            margin: 0.2rem 0 0 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .archive-arrow {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.08);
            background: #fff;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .archive-arrow:hover {
            background: var(--neon-coral);
            color: #fff;
            border-color: var(--neon-coral);
        }

        .archive-arrow:active {
            transform: scale(0.95);
        }

        /* ===== ПОПАП АРХИВА ===== */
        .archive-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            overflow-y: auto;
        }

        .archive-modal.active {
            display: flex;
        }

        .archive-modal-content {
            background: #fff;
            border-radius: 24px;
            max-width: 600px;
            width: 100%;
            padding: 2rem;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .archive-modal-close {
            position: sticky;
            top: 0;
            float: right;
            background: none;
            border: none;
            font-size: 1.8rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.2s;
            z-index: 10;
        }

        .archive-modal-close:hover {
            color: var(--neon-coral);
        }

        .archive-modal-body {
            padding-top: 0.5rem;
        }

        .archive-modal-image {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .archive-modal-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        .archive-modal-date {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
        }

        .archive-modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--graphite-dark);
            margin-bottom: 0.5rem;
        }

        .archive-modal-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .archive-modal-results {
            background: var(--graphite-deep);
            border-radius: 16px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.5rem;
        }

        .archive-modal-results h4 {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--neon-coral);
            margin-bottom: 0.5rem;
        }

        .archive-modal-results ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .archive-modal-results ul li {
            padding: 0.2rem 0;
            font-size: 0.9rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .archive-modal-results ul li::before {
            content: '✦';
            color: var(--neon-coral);
            font-size: 0.7rem;
        }

        .archive-modal-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .archive-modal-actions .btn {
            flex: 1;
            text-align: center
